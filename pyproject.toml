[project]
name = "skoolathome"
version = "0.1.0"
description = "Course-grounded revision sheets prepared by a local model"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.117",
    "httpx>=0.28",
    "nostr-sdk>=0.45.1,<0.46",
    "psycopg[binary,pool]>=3.2",
    "pydantic>=2.9",
    "pywebpush>=2.5",
    "segno>=1.6",
]

[project.scripts]
skoolathome = "skoolathome.cli:main"
skoolathome-ed-probe = "skoolathome.collectors.ecoledirecte.probe:main"

[dependency-groups]
agent = [
    "langchain-core>=1.8,<2",
    "langchain-openai>=1.8,<2",
    "langfuse>=5.2,<6",
    "langgraph>=1.2,<2",
    "langgraph-checkpoint-postgres>=3.2,<4",
    "rapidfuzz>=3.14",
    "sympy>=1.14",
]
dev = [
    "pytest>=8",
    "uvicorn>=0.30",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/skoolathome"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.uv]
# The agent group (model, graph, tracing) is for the laptop only. Vercel's API does not import it.
default-groups = ["dev", "agent"]
